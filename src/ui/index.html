<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GenShape3D Worker</title>
  <style>
    :root {
      --ground: #1a1a2e; --panel: #16213e; --line: #0f3460; --text: #e0e0e0; --muted: #8a9bb0;
      --accent: #00d2ff; --good: #4caf50; --bad: #ff6b6b; --warn: #ffb74d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font: 13px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--ground); color: var(--text);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .top { background: var(--panel); border-bottom: 1px solid var(--line); padding: 12px 16px; flex: none; }
    .top-row { display: flex; align-items: center; gap: 10px; }
    h1 { font-size: 15px; font-weight: 600; color: var(--accent); }
    #refused { margin-left: auto; }
    #refused + .gpu { margin-left: 12px; }
    .gpu { color: var(--muted); font-variant-numeric: tabular-nums; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; }
    .dot.ok { background: var(--good); } .dot.busy { background: var(--warn); } .dot.down { background: var(--bad); }
    .status { height: 38px; margin-top: 6px; overflow: hidden; font-size: 13px; }
    .status.down { color: var(--bad); font-weight: 600; }

    .scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 0 16px 16px; }
    h2 {
      font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
      margin: 14px 0 6px; display: flex; gap: 8px; align-items: baseline;
    }
    h2 b { color: var(--text); font-variant-numeric: tabular-nums; }
    .none { color: var(--muted); padding: 10px 0; min-height: 40px; }
    ul { list-style: none; }
    .job { display: flex; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
    .job:first-child { border-top: 0; }
    .thumb { width: 44px; height: 44px; border-radius: 6px; object-fit: cover; background: var(--line); flex: none; }
    .body { flex: 1; min-width: 0; }
    .name { font-weight: 600; overflow-wrap: anywhere; }
    .meta { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
    .why { font-size: 12px; margin-top: 2px; overflow-wrap: anywhere; }
    .why.bad { color: var(--bad); } .why.warn { color: var(--warn); }
    .bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin-top: 5px; }
    .bar i { display: block; height: 100%; width: 100%; background: var(--accent); transform-origin: left; transition: transform .4s; }
    details { font-size: 12px; color: var(--muted); margin-top: 2px; }
    summary { cursor: pointer; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; font: 11px/1.4 Consolas, monospace; margin-top: 4px; user-select: text; }
    a { color: var(--accent); }
    .side { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
    .pill { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; background: var(--line); }
    .pill.done { color: var(--good); } .pill.failed { color: var(--bad); } .pill.cancelled { color: var(--muted); }
    button { font: inherit; color: var(--text); background: var(--line); border: 0; border-radius: 5px; padding: 3px 10px; cursor: pointer; }
    button:hover { filter: brightness(1.25); }
    button:focus-visible, tr:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    .switch { display: inline-flex; gap: 2px; margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 400; }
    .switch button { background: none; color: var(--muted); }
    .switch button.on { background: var(--line); color: var(--text); }

    .periods { max-height: 196px; overflow-y: auto; border: 1px solid var(--line); border-radius: 6px; }
    table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    th { position: sticky; top: 0; background: var(--panel); color: var(--muted); font-size: 11px; font-weight: 600; text-align: right; padding: 4px 10px; }
    td { text-align: right; padding: 4px 10px; border-top: 1px solid var(--line); }
    th:first-child, td:first-child { text-align: left; }
    tbody tr { cursor: pointer; }
    tbody tr:hover { background: var(--panel); }
    tbody tr.on { background: var(--line); }
    td.failed { color: var(--bad); font-weight: 700; } td.done { color: var(--good); }
    td.zero { color: var(--muted); font-weight: 400; }
  </style>
</head>
<body>
  <div class="top">
    <div class="top-row">
      <div class="dot" id="dot"></div>
      <h1 id="title">GenShape3D Worker</h1>
      <div class="gpu" id="refused"></div>
      <div class="gpu" id="gpu"></div>
    </div>
    <div class="status" id="status">Starting</div>
  </div>

  <div class="scroll">
    <h2>In progress <b id="nowCount">0</b></h2>
    <ul id="now"></ul>

    <h2>Waiting <b id="waitCount">0</b></h2>
    <ul id="wait"></ul>

    <h2>History
      <span class="switch">
        <button id="daily" class="on">Daily</button>
        <button id="weekly">Weekly</button>
      </span>
    </h2>
    <div class="periods"><table>
      <thead><tr><th id="periodHead">Day</th><th>Done</th><th>Failed</th><th>Cancelled</th></tr></thead>
      <tbody id="periods"></tbody>
    </table></div>

    <div id="picked"></div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const workerId = (window.api && window.api.workerId) || 'unknown';
    $('title').textContent = document.title = `GenShape3D Worker [${workerId}]`;

    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const clock = (t) => (t ? new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }) : '');
    function span(ms) {
      const s = Math.max(0, Math.round(ms / 1000));
      if (s < 60) return `${s}s`;
      if (s < 3600) return `${Math.floor(s / 60)}m ${s % 60}s`;
      return `${Math.floor(s / 3600)}h ${Math.floor(s / 60) % 60}m`;
    }

    // Stored files go through the public image route.
    const API = 'https://api.genshape3d.com';
    function fileUrl(url) {
      if (!url) return '';
      if (url.startsWith('/api/image')) return API + url;
      for (const p of ['/uploads/', '/mvtest/', '/outputs/', '/mv-auto/'])
        if (url.includes(p)) return `${API}/api/image?key=${encodeURIComponent(p.slice(1) + url.split(p)[1])}`;
      return url;
    }

    const KIND = { model: '3D model', paint: 'Paint', repair: 'Mesh repair', parts: 'Parts', picture: 'Picture' };
    const EXIT = {
      3221225477: 'crashed (memory access violation)',
      3221226505: 'crashed (stack buffer overrun)',
      4294967295: 'was stopped from outside',
      null: 'was killed',
      1: 'stopped with an error',
    };
    /** The first line of a failure in plain words. The whole text stays one click away. */
    function reason(error) {
      if (!error) return 'No reason was recorded';
      const line = String(error).split(/\r?\n/)[0].replace(/^Error:\s*/, '');
      const m = line.match(/^(.*?) process exited with code (\S+?):/);
      if (m) return `${m[1]} ${EXIT[m[2]] || `stopped with code ${m[2]}`}`;
      return line.slice(0, 200);
    }

    const thumb = (j) => {
      const u = fileUrl(j.image);
      return u ? `<img class="thumb" src="${esc(u)}" alt="" loading="lazy">` : '<div class="thumb"></div>';
    };
    const tags = (j) => [KIND[j.kind], j.model, j.bench ? 'bench' : ''].filter(Boolean).map(esc).join(' · ');

    function nowRow(j) {
      if (j.kind === 'picture') return `<li class="job">${thumb(j)}<div class="body">
        <div class="name">${esc(j.name)}</div>
        <div class="meta">${tags(j)} · started ${clock(j.started)} · <span data-since="${esc(j.started)}">${span(Date.now() - new Date(j.started))}</span></div>
      </div></li>`;
      const pct = Math.min(100, j.pct || 0);
      const note = j.orphan ? '<div class="why bad">Marked in progress, but no process on this machine is running it</div>'
        : j.stillMs > 300000 ? `<div class="why warn">No change for ${span(j.stillMs)}</div>` : '';
      const cancel = j.kind === 'model' ? `<button data-cancel="${esc(j.id)}">Cancel</button>` : '';
      return `<li class="job">${thumb(j)}<div class="body">
        <div class="name">${esc(j.name || 'Untitled')}</div>
        <div class="meta">${tags(j)} · started ${clock(j.started)} · <span data-since="${esc(j.started)}">${span(Date.now() - new Date(j.started))}</span></div>
        <div class="meta">${pct}% · ${esc(j.phase || 'Starting')}</div>
        <div class="bar"><i style="transform:scaleX(${pct / 100})"></i></div>${note}
      </div><div class="side">${cancel}</div></li>`;
    }

    function waitRow(j) {
      const cancel = j.kind === 'model' ? `<button data-cancel="${esc(j.id)}">Cancel</button>` : '';
      return `<li class="job">${thumb(j)}<div class="body">
        <div class="name">${esc(j.name || 'Untitled')}</div>
        <div class="meta">${tags(j)} · queued <span data-since="${esc(j.created)}">${span(Date.now() - new Date(j.created))}</span> ago</div>
        <div class="why ${j.blocked ? 'bad' : ''}">${esc(j.why)}</div>
      </div><div class="side">${cancel}</div></li>`;
    }

    function doneRow(j) {
      const took = j.started && j.finished ? ` · took ${span(new Date(j.finished) - new Date(j.started))}` : '';
      const peak = j.peak_mb ? ` · GPU peak ${(j.peak_mb / 1024).toFixed(1)} GB` : '';
      const failed = j.status === 'failed'
        ? `<div class="why bad">${esc(reason(j.error))}</div>${j.error ? `<details><summary>Full text</summary><pre>${esc(j.error)}</pre></details>` : ''}` : '';
      const view = j.result ? `<a href="${esc(fileUrl(j.result))}" target="_blank" rel="noopener">View 3D</a>` : '';
      return `<li class="job">${thumb(j)}<div class="body">
        <div class="name">${esc(j.name || 'Untitled')}</div>
        <div class="meta">${tags(j)} · ${clock(j.finished)}${took}${peak}</div>${failed}
      </div><div class="side"><span class="pill ${esc(j.status)}">${esc(j.status)}</span>${view}</div></li>`;
    }

    /** Only touches the page when the content changed, so nothing flickers and the scroll stays put. */
    const shown = {};
    function put(id, html) {
      if (shown[id] === html) return;
      shown[id] = html;
      $(id).innerHTML = html;
    }

    // Periods: every week is the sum of its days, so the two views always agree.
    const pad = (n) => String(n).padStart(2, '0');
    const dayKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    const parseDay = (k) => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
    const shortDay = (d) => d.toLocaleDateString([], { weekday: 'short', day: 'numeric', month: 'short' });
    function monday(k) { const d = parseDay(k); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d; }
    function dayLabel(k) {
      const today = new Date(); const y = new Date(); y.setDate(y.getDate() - 1);
      return k === dayKey(today) ? 'Today' : k === dayKey(y) ? 'Yesterday' : shortDay(parseDay(k));
    }
    function periods(days, mode) {
      const today = dayKey(new Date());
      const list = days.some((d) => d.day === today) ? days : [{ day: today, done: 0, failed: 0, cancelled: 0 }, ...days];
      if (mode === 'daily') return list.map((d) => ({ ...d, from: d.day, to: d.day, label: dayLabel(d.day) }));
      const weeks = new Map();
      for (const d of list) {
        const start = monday(d.day); const from = dayKey(start);
        const end = new Date(start); end.setDate(end.getDate() + 6);
        const w = weeks.get(from) || { from, to: dayKey(end), done: 0, failed: 0, cancelled: 0,
          label: from === dayKey(monday(today)) ? 'This week' : `Week of ${shortDay(start)}` };
        w.done += d.done; w.failed += d.failed; w.cancelled += d.cancelled;
        weeks.set(from, w);
      }
      return [...weeks.values()];
    }

    let mode = 'daily';
    let pick = null;
    let days = [];

    const cell = (kind, n) => `<td class="${n ? kind : 'zero'}">${n}</td>`;
    function drawPeriods() {
      const list = periods(days, mode);
      if (!pick || !list.some((p) => p.from === pick.from)) pick = list[0];
      else pick = list.find((p) => p.from === pick.from);
      $('periodHead').textContent = mode === 'daily' ? 'Day' : 'Week';
      put('periods', list.map((p) => `<tr tabindex="0" data-from="${p.from}" class="${p.from === pick.from ? 'on' : ''}">
        <td>${esc(p.label)}</td>${cell('done', p.done)}${cell('failed', p.failed)}<td>${p.cancelled}</td></tr>`).join(''));
      drawPicked();
    }

    let pickedKey = '';
    let pickedAsk = 0;
    async function drawPicked() {
      const key = `${pick.from}|${pick.to}|${pick.done}|${pick.failed}|${pick.cancelled}`;
      if (key === pickedKey) return;
      const ask = ++pickedAsk;
      let rows;
      try {
        rows = await window.api.getHistory(pick.from, pick.to);
      } catch (e) {
        if (ask === pickedAsk) put('picked', `<div class="why bad">Could not read this period: ${esc(e.message)}</div>`);
        return;
      }
      if (ask !== pickedAsk) return;
      pickedKey = key;
      const group = (status, title) => {
        const these = rows.filter((j) => j.status === status);
        return these.length ? `<h2>${title} <b>${these.length}</b></h2><ul>${these.map(doneRow).join('')}</ul>` : '';
      };
      put('picked', `${group('failed', 'Failed')}${group('done', 'Done')}${group('cancelled', 'Cancelled')}`
        || `<div class="none">Nothing finished in ${esc(pick.label.toLowerCase())}</div>`);
    }

    let state = null;
    function drawStatus() {
      if (!state) return;
      const r = state.report;
      const old = r ? Date.now() - r.at : Infinity;
      const dbDown = state.reportError || old > 30000;
      const down = dbDown || state.pollError;
      let text;
      if (dbDown) {
        const why = state.reportError ? state.reportError.message : 'the worker has stopped updating this window';
        text = `Cannot read the database: ${why}. ${r ? `Everything below is from ${clock(r.at)}.` : 'Nothing below is real yet.'}`;
      } else if (state.pollError) {
        text = `Cannot take jobs: ${state.pollError.message}`;
      } else if (r.inProgress.length) {
        text = `Working on ${r.inProgress.length}${r.waiting.length ? `, ${r.waiting.length} waiting` : ''}`;
      } else if (r.waiting.length) {
        text = `Idle, ${r.waiting.length} waiting`;
      } else {
        text = 'Idle, nothing waiting';
      }
      $('status').textContent = text;
      $('status').className = down ? 'status down' : 'status';
      $('dot').className = `dot ${down ? 'down' : r && r.inProgress.length ? 'busy' : 'ok'}`;
    }

    function update(next) {
      state = next;
      drawStatus();
      const r = state.report;
      if (!r) return;
      $('gpu').textContent = r.gpu ? `GPU memory ${r.gpu.usedGb.toFixed(1)} of ${r.gpu.totalGb.toFixed(1)} GB` : 'GPU memory unknown';
      $('nowCount').textContent = r.inProgress.length;
      $('refused').textContent = r.refused ? `Refused while busy: ${r.refused}` : '';
      $('waitCount').textContent = r.waiting.length;
      put('now', r.inProgress.map(nowRow).join('') || '<li class="none">Nothing running</li>');
      put('wait', r.waiting.map(waitRow).join('') || '<li class="none">Nothing waiting</li>');
      days = r.days;
      drawPeriods();
    }

    function choose(row) {
      if (!row) return;
      pick = periods(days, mode).find((p) => p.from === row.dataset.from);
      drawPeriods();
    }
    $('periods').addEventListener('click', (e) => choose(e.target.closest('tr')));
    $('periods').addEventListener('keydown', (e) => { if (e.key === 'Enter') choose(e.target.closest('tr')); });
    for (const m of ['daily', 'weekly']) $(m).addEventListener('click', () => {
      mode = m; pick = null;
      $('daily').className = m === 'daily' ? 'on' : '';
      $('weekly').className = m === 'weekly' ? 'on' : '';
      drawPeriods();
    });
    document.addEventListener('click', async (e) => {
      const id = e.target.dataset && e.target.dataset.cancel;
      if (id && confirm(`Cancel job ${id.slice(0, 8)}?`)) await window.api.cancelJob(id);
    });

    window.api.getState().then(update);
    window.api.onJobUpdate(update);

    // The clocks and the "is this still fresh" check run here, so a frozen worker shows as frozen.
    setInterval(() => {
      for (const el of document.querySelectorAll('[data-since]')) el.textContent = span(Date.now() - new Date(el.dataset.since));
      drawStatus();
    }, 1000);
  </script>
</body>
</html>
